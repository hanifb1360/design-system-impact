name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) { console.error('Tag must equal v'+p.version); process.exit(1) }"
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
